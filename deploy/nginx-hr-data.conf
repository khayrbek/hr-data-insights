# hr-data.ru — Workforce Intelligence Platform
# Канон: https://hr-data.ru ; www и http уходят 301 на канон.

# --- HTTP: ACME-челлендж + редирект на HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name hr-data.ru www.hr-data.ru;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; allow all; }
    location / { return 301 https://hr-data.ru$request_uri; }
}

# --- HTTPS: канонический адрес ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hr-data.ru;

    ssl_certificate     /etc/letsencrypt/live/hr-data.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr-data.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/hrdata;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/hrdata.access.log;
    error_log  /var/log/nginx/hrdata.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; allow all; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(png|jpg|jpeg|svg|webp|woff2?)$ { expires 30d; add_header Cache-Control "public"; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}

# --- HTTPS: www → канон ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hr-data.ru;

    ssl_certificate     /etc/letsencrypt/live/hr-data.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr-data.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; allow all; }
    location / { return 301 https://hr-data.ru$request_uri; }
}
